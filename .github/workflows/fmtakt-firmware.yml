# fmtakt: build the FM1 firmware + flashing workbench on a Windows runner.
# Output artifact: FM1-Official-Open-Source.html (open in Chrome, connect FM1 over USB, install).
name: fmtakt firmware
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FM1_PI32_TOOLCHAIN: C:\JL\pi32
      FM1_SOURCE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
    steps:
      - uses: actions/checkout@v4

      - name: Cache WASI SDK (simulator compiler)
        uses: actions/cache@v4
        with:
          path: build/tools
          key: wasi-sdk-27-windows

      - name: Install JieLi toolchain 2.5.3 (PI32v2 clang 4.0.1)
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 --output jl.exe https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          "installer sha256: " + (Get-FileHash jl.exe -Algorithm SHA256).Hash
          # Inno Setup installer; its silent mode hangs on the runner, so unpack it instead.
          if (!(Test-Path C:\JL\pi32\bin\clang.exe)) {
            choco install innoextract -y --no-progress
            innoextract --silent --extract --output-dir jlx jl.exe
            $clang = Get-ChildItem jlx -Recurse -Filter clang.exe | Where-Object { $_.Directory.Name -eq 'bin' -and $_.Directory.Parent.Name -eq 'pi32' } | Select-Object -First 1
            if (!$clang) { Get-ChildItem jlx -Recurse -Filter clang.exe | ForEach-Object FullName; throw 'pi32/bin/clang.exe not found in installer' }
            New-Item -ItemType Directory C:\JL -Force | Out-Null
            Copy-Item $clang.Directory.Parent.FullName C:\JL\pi32 -Recurse
          }
          Get-ChildItem C:\JL\pi32\bin | Select-Object -First 20 Name

      - name: Build simulator
        shell: cmd  # build.bat starts Windows PowerShell 5.1; from pwsh it inherits a broken PSModulePath
        run: .\build.bat --web

      - name: fmtakt tests (simulator)
        shell: pwsh
        run: |
          Get-ChildItem tests\fmtakt\*.test.mjs | ForEach-Object { node $_.FullName; if ($LASTEXITCODE) { throw "failed: $($_.Name)" } }

      - name: Build firmware + workbench
        shell: cmd  # build.bat starts Windows PowerShell 5.1; from pwsh it inherits a broken PSModulePath
        run: .\build.bat --package

      - name: Size report (largest symbols, mod vs stock)
        if: always()
        shell: pwsh
        run: |
          $nm = 'C:\JL\pi32\bin\llvm-nm.exe'
          if (Test-Path build\dx7\sdk.elf) {
            "== fmtakt: 80 largest symbols =="
            & $nm --print-size --size-sort --radix=d build\dx7\sdk.elf | Select-Object -Last 80
            Copy-Item build\dx7\sdk.elf fmtakt-sdk.elf
          }
          "== stock upstream screen.c (4c7496d) =="
          git show 4c7496d:app/screen.c | Set-Content -NoNewline -Encoding utf8NoBOM app\screen.c
          cmd /c "powershell -NoProfile -ExecutionPolicy Bypass -File sdk\Build.ps1 -FirmwareOnly 2>&1" | Select-String 'app image|fit|Offline package'
          if (Test-Path build\dx7\sdk.elf) { & $nm --print-size --size-sort --radix=d build\dx7\sdk.elf | Select-Object -Last 80 | Set-Content stock-symbols.txt }
          git checkout -- app/screen.c

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report-${{ github.sha }}
          path: |
            fmtakt-sdk.elf
            stock-symbols.txt
            build/dx7/firmware-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: fmtakt-firmware-${{ github.sha }}
          path: |
            build/official-web/FM1-Official-Open-Source.html
            build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc
            build/dx7/firmware-report.json
            build/dx7/web-package-report.json
